name: Deploy to AWS

on:
  push:
    branches:
      - release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VITE_BACKEND_URL: https://server.hehechat.io
      VITE_BUILDNUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build project
        run: yarn build

      - name: Configure SSH
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_HOST: ${{ secrets.AWS_SSH_HOST }}
        run: |
          mkdir -p ~/.ssh

          echo "${AWS_SSH_KEY}" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions

          ssh-keyscan -H "${AWS_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          AWS_SSH_HOST: ${{ secrets.AWS_SSH_HOST }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/github_actions \
            -o IdentitiesOnly=yes \
            "${AWS_SSH_USER}@${AWS_SSH_HOST}" \
            "echo SSH connection successful"

      - name: Deploy files
        env:
          AWS_SSH_HOST: ${{ secrets.AWS_SSH_HOST }}
          AWS_SSH_USER: ${{ secrets.AWS_SSH_USER }}
          AWS_SSH_PATH: /home/ec2-user/live/cycling-hud
        run: |
          rsync \
            -avz \
            --delete \
            -e "ssh -i ~/.ssh/github_actions -o IdentitiesOnly=yes" \
            ./dist/ \
            "${AWS_SSH_USER}@${AWS_SSH_HOST}:${AWS_SSH_PATH}/"